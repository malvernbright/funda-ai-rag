[project]
name = "funda-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "The LazyCoder", email = "malvernbright.95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "pypdf>=6.19.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
funda-ai-backend = "funda_ai_backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
